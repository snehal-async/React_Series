<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotify Grid Layout</title>
<link
  href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
  rel="stylesheet"
/>
<link rel="stylesheet" href="style2.css">
</head>
<body>

<div class="container">

    <!-- Sidebar -->
    <div class="sidebar">
      <div id="logo">
        <i class="ri-spotify-fill"></i>
        </div>

        <div id="playlists">
        <h2>Your Library</h2>
        <h3>+ Create</h3>
          </div>
      </div>

    <!-- Topbar -->
    <div class="topbar">
        <div class="search">What do you want to play?</div>
        <div>Profile</div>
    </div>

    <!-- Main Content -->
    <div class="main">
        <h2>Made For You</h2>

        <div class="card-container">

            <div class="card">
                <img src="https://picsum.photos/200?1">
                <h4>Daily Mix 1</h4>
                <p>Pritam, Atif Aslam and more</p>
            </div>

            <div class="card">
                <img src="https://picsum.photos/200?2">
                <h4>Daily Mix 2</h4>
                <p>Yo Yo Honey Singh and more</p>
            </div>

            <div class="card">
                <img src="https://picsum.photos/200?3">
                <h4>Daily Mix 3</h4>
                <p>Kishore Kumar and more</p>
            </div>

            <div class="card">
                <img src="https://picsum.photos/200?4">
                <h4>Daily Mix 4</h4>
                <p>Lo-fi 2307 and more</p>
            </div>

            <div class="card">
                <img src="https://picsum.photos/200?5">
                <h4>Daily Mix 5</h4>
                <p>Study Music and more</p>
            </div>

        </div>
    </div>

    <!-- Bottom Player -->
    <div class="player">
        <div class="controls">
            <button>⏮</button>
            <button>▶</button>
            <button>⏭</button>
        </div>
    </div>

</div>

</body>
</html>
